page_size        = 200
max_column_width = 40
max_rows         = 1000          # rows fetched per console query
compare_max_rows = 100000        # rows a data compare reads per side
editor           = "vim"        # <space>v; default $VISUAL, $EDITOR, nvim
export_dir       = "~/.sql/export"
icons            = "nerd"        # tree icons: "nerd" (needs a Nerd Font) or "plain"

# Colors: ANSI indexes "0"–"255" (follow your terminal's palette) or "#rrggbb".
# Slots: border focus error accent on_error visual_bg visual_fg changed
#        inserted view builtin string number operator
#        key_string key_hash key_list key_set key_zset key_stream key_other (Redis type badges)
[theme]
# focus  = "#7aa2f7"
# accent = "14"